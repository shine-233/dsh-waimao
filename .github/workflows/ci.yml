# CI：每次 push/PR 在云端跑完整测试套件（12 套，含端到端本地仿真，零外部服务依赖）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full test suite
        run: npm test
