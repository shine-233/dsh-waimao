# CI：每次 push/PR 在云端跑核心测试子集（快速、零外部服务依赖）。
# 完整集成测试（e2e-local / v9-deep 等）依赖本地仿真 server 与网络桩，适合本地 `npm test` 运行。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core test subset
        run: node test/smoke.mjs && node test/ddg-fixture.mjs && node test/v2-modules.mjs && node test/v3-modules.mjs && node test/host-sim.mjs
